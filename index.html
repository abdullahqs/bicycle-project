<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nearest Bike-Sharing Finder</title>
    <!-- Prevents the browser from requesting a missing favicon.ico file -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- City Search Section (Hidden by default, revealed only if GPS access is denied) -->
    <div id="searchSectionContainer" style="margin-bottom: 20px; display: none">
      <div class="search-section">
        <input
          type="text"
          id="cityInput"
          placeholder="Enter city name (e.g., Paris, Washington)..."
        />
        <button id="searchBtn">Search City</button>
      </div>
      <!-- Search status message appears right below the text bar -->
      <div
        id="searchStatusMessage"
        style="margin-top: 8px; font-size: 14px; font-weight: bold"
      ></div>
    </div>

    <!-- Station Dropdown Section (Hidden until a city network is successfully loaded) -->
    <div id="stationSelectContainer" style="margin-bottom: 20px; display: none">
      <label for="stationDropdown" id="networkTitleLabel"
        >Select a station:</label
      ><br />
      <select id="stationDropdown" style="margin-top: 5px; width: 300px">
        <option value="">-- Choose a station --</option>
      </select>
    </div>

    <!-- Selected Station Details Display -->
    <div
      id="selectedStationDetails"
      style="margin-bottom: 20px; font-weight: bold"
    ></div>

    <hr />

    <!-- GPS / Nearby Section -->
    <div class="gps-section" style="margin-bottom: 20px">
      <label for="toggle-choice">Sort nearby GPS stations by:</label>
      <select id="toggle-choice">
        <option value="" disabled selected>Select an option...</option>
        <option value="option1">Empty Docks</option>
        <option value="option2">Free Bikes</option>
      </select>
      <button
        id="refresh-btn"
        style="margin-left: 10px; padding: 5px 10px; cursor: pointer"
      >
        🔄 Refresh
      </button>
    </div>

    <!-- Main Status message display -->
    <div id="status-message" style="margin-top: 15px; font-weight: bold">
      Initializing...
    </div>

    <!-- Station List Container (Used by GPS sorting view) -->
    <ul
      id="station-list"
      style="margin-top: 10px; list-style-type: none; padding-left: 0"
    >
      <!-- Stations will be dynamically inserted here -->
    </ul>

    <!-- Single entry point module: apps.js imports everything else automatically -->
    <script type="module" src="apps.js"></script>
  </body>
</html>
